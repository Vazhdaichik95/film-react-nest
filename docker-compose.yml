services:
  frontend-builder:
    image: ghcr.io/vazhdaichik95/film-react-nest-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/frontend-dist
    networks:
      - app_network
    restart: "no"

  backend:
    image: ghcr.io/vazhdaichik95/film-react-nest-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - app_network

  nginx:
    image: ghcr.io/vazhdaichik95/film-react-nest-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
      - frontend-builder
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: film_db
      POSTGRES_USER: film_user
      POSTGRES_PASSWORD: film_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_user -d film_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist: